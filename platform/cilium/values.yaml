# Cilium on single-node k3s. Host-specific values (API endpoint, device,
# pod CIDR) are set by ansible/playbooks/k3s.yml from group_vars.
kubeProxyReplacement: true
k8sServicePort: 6443

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24

operator:
  replicas: 1
  rollOutPods: true

# Restart agents/Envoy when their configuration changes (helm upgrade alone
# only updates the ConfigMap).
rollOutCiliumPods: true

# With flannel disabled, k3s's containerd uses the standard CNI paths
# (/etc/cni/net.d, /opt/cni/bin).
cni:
  # Leave other CNI configs alone so Multus can chain secondary networks.
  exclusive: false

# Recommended for KubeVirt: keep socket-level LB out of pod/VM namespaces.
socketLB:
  hostNamespaceOnly: true

# Gateway API in host network mode: Envoy listens on the host's ports, so UFW
# (admin_sources / admin_tcp_ports) applies. A LoadBalancer/NodePort Service
# would be handled by the eBPF datapath before UFW. Gateways: platform/gateway.
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# Envoy runs as its own DaemonSet; ports below 1024 need NET_BIND_SERVICE.
envoy:
  rollOutPods: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [NET_ADMIN, SYS_ADMIN, NET_BIND_SERVICE]

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
