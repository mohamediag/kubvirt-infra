# spec.sshAuthorizedKeys is added by ansible/playbooks/clusters.yml.
apiVersion: platform.kubvirt-infra.io/v1alpha1
kind: KubernetesCluster
metadata:
  name: cluster-b
  namespace: cluster-b
spec:
  running: true
  network:
    vlanId: 120
    subnet: 192.168.120.0/24
    nodeIPStart: 10
    loadBalancerRange: {start: 200, stop: 220}
    podCIDR: 10.120.0.0/16
    serviceCIDR: 10.121.0.0/16
  cilium:
    clusterId: 2
  controlPlane:
    replicas: 1
    cpu: 2
    memory: 4Gi
    diskSize: 20Gi
  workers:
    replicas: 2
    cpu: 4
    memory: 8Gi
    diskSize: 40Gi
