# Site-specific settings of the management host.
node_ip: 65.21.142.110
node_iface: enp5s0
pod_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16
kubeconfig: /etc/rancher/k3s/k3s.yaml
# Management + workload clusters, for kubectl/kubectx in login shells.
merged_kubeconfig: /root/.kube/config

# VLAN-aware bridge for VMs, NATed to the internet through node_iface.
# The bridge name is also referenced in platform/vm-network/vm-net.yaml and
# crossplane/composition.yaml.
vm_bridge: br-vms
# Untagged network (smoke-test VM).
vm_net_cidr: 192.168.100.0/24
vm_net_gateway: 192.168.100.1
vm_net_prefix: 24
vm_dns: [1.1.1.1, 9.9.9.9]

# One VLAN per workload cluster. The host owns .1 of each subnet as gateway
# and BGP peer. Each cluster's nodes announce its pod CIDR and LoadBalancer
# IPs from AS `asn`; the host (FRR) accepts nothing else from that VLAN, so
# these entries are the fabric's policy, not the tenant's. Must match
# spec.network of clusters/<name>/cluster.yaml (checked by `make clusters`);
# no two ranges may overlap (checked by `make host`).
vm_vlans:
  - {id: 110, name: cluster-a, cidr: 192.168.110.0/24, asn: 65110, pod_cidr: 10.110.0.0/16, lb_cidr: 10.250.110.0/24}
  - {id: 120, name: cluster-b, cidr: 192.168.120.0/24, asn: 65120, pod_cidr: 10.120.0.0/16, lb_cidr: 10.250.120.0/24}

# The fabric: FRR on the host, one eBGP session per workload node.
fabric_asn: 65000
# Traffic from workload pods to this range keeps the pod IP (no SNAT): pods
# and LoadBalancer IPs of all clusters are routed. Everything else (internet,
# node IPs) is masqueraded to the node IP.
fabric_routed_cidr: 10.0.0.0/8

# Keys injected into VMs: a host-generated key (lets the management host reach
# the VMs) plus the operator keys already authorized on the host.
vm_ssh_key: /root/.ssh/vm_ed25519
vm_authorized_keys_file: /root/.ssh/authorized_keys

# Inbound access to the host itself.
admin_sources: [94.9.253.229]
admin_tcp_ports: [22, 80, 443]

apt_upgrade: true
