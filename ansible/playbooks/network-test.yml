# Verifies workload-cluster networking: every node has a BGP session with the
# fabric; from every cluster's control plane, internet and other clusters
# (nodes, pods, LoadBalancer IPs) reachable, the host and the management
# cluster's networks blocked; pods reach other clusters' pods with their own
# IP (no SNAT); from the internet side, HAProxy sends each cluster's domain to
# that cluster's Gateway, over HTTP and HTTPS (passed through).
- name: Workload cluster network test
  hosts: all
  become: true
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    ssh: >-
      ssh -i {{ vm_ssh_key }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes -o ConnectTimeout=5
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Find cluster definitions
      ansible.builtin.find:
        paths: "{{ repo_root }}/clusters"
        patterns: cluster.yaml
        recurse: true
      register: cluster_files

    - name: Describe clusters
      ansible.builtin.set_fact:
        clusters: "{{ clusters | default([]) + [{'name': xr.metadata.name, 'namespace': xr.metadata.namespace,
                       'cp': prefix ~ '.' ~ (xr.spec.network.nodeIPStart | default(10)),
                       'nodes': 1 + (xr.spec.workers.replicas | default(2)),
                       'subnet': xr.spec.network.subnet,
                       'gateway': prefix ~ '.1',
                       'domain': site.domain,
                       'ingress': site.lb_cidr | ansible.utils.ipaddr('-2') | ansible.utils.ipaddr('address'),
                       'kubeconfig': '/root/.kube/' ~ xr.metadata.name ~ '.kubeconfig'}] }}"
      vars:
        xr: "{{ lookup('file', item.path) | from_yaml }}"
        prefix: "{{ xr.spec.network.subnet | regex_replace('\\.0/24$', '') }}"
        site: "{{ vm_networks | selectattr('name', 'equalto', xr.metadata.name) | first }}"
      loop: "{{ cluster_files.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"

    - name: Fetch kubeconfigs
      ansible.builtin.shell: |
        umask 077; mkdir -p /root/.kube
        kubectl -n {{ item.namespace }} get secret {{ item.name }}-kubeconfig -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ item.kubeconfig }}
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Every node has a BGP session with the fabric
      ansible.builtin.shell: >-
        vtysh -c 'show bgp ipv4 unicast summary json'
        | jq --arg net '{{ item.subnet | regex_replace('0/24$', '') }}'
        '[.peers | to_entries[] | select((.key | startswith($net)) and .value.state == "Established")] | length'
      register: bgp_sessions
      changed_when: false
      failed_when: bgp_sessions.stdout | int != item.nodes | int
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"

    # agnhost netexec answers /clientip with the caller's address and /dial
    # makes the pod itself call another address.
    - name: Deploy a test LoadBalancer service in each cluster
      ansible.builtin.shell: |
        k="kubectl --kubeconfig {{ item.kubeconfig }} -n network-test"
        kubectl --kubeconfig {{ item.kubeconfig }} create namespace network-test --dry-run=client -o yaml | kubectl --kubeconfig {{ item.kubeconfig }} apply -f -
        $k create deployment echo --image={{ echo_image }} --port=8080 --dry-run=client -o yaml -- /agnhost netexec --http-port=8080 | $k apply -f -
        $k expose deployment echo --type=LoadBalancer --port=80 --target-port=8080 --dry-run=client -o yaml | $k apply -f -
        $k rollout status deployment/echo --timeout=300s >/dev/null
        $k wait svc/echo --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' --timeout=120s >/dev/null
        $k apply -f - >/dev/null <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata: {name: echo}
        spec:
          parentRefs: [{name: ingress, namespace: gateway}]
          hostnames: [echo.{{ item.domain }}]
          rules: [{backendRefs: [{name: echo, port: 80}]}]
        EOF
        $k wait httproute/echo --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True --timeout=120s >/dev/null
        echo "$($k get svc echo -o jsonpath='{.status.loadBalancer.ingress[0].ip}') $($k get pod -l app=echo -o jsonpath='{.items[0].status.podIP} {.items[0].metadata.name}')"
      vars:
        echo_image: registry.k8s.io/e2e-test-images/agnhost:2.53
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"
      register: lb
      changed_when: false

    - name: Record LoadBalancer IPs
      ansible.builtin.set_fact:
        with_lb: "{{ with_lb | default([]) + [item.0 | combine({'lb': ips[0], 'pod': ips[1], 'pod_name': ips[2]})] }}"
      vars:
        ips: "{{ (item.1.stdout_lines | last).split() }}"
      loop: "{{ clusters | zip(lb.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"

    - name: Use clusters with LoadBalancer IPs
      ansible.builtin.set_fact:
        clusters: "{{ with_lb }}"

    - name: Run checks from each control plane
      ansible.builtin.shell: "{{ ssh }} ubuntu@{{ src.cp }} sh -s"
      args:
        stdin: "{{ lookup('template', '../templates/network-check.sh.j2') }}"
      vars:
        src: "{{ item }}"
        peers: "{{ clusters | rejectattr('name', 'equalto', item.name) | list }}"
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"
      register: checks
      changed_when: false

    # From the host (it reaches pods through the BGP routes): ask each echo
    # pod to call the other clusters' echo pods, which report the source IP.
    - name: Pods reach other clusters' pods without SNAT
      ansible.builtin.shell: >-
        curl -fsS -m 10 'http://{{ item.0.pod }}:8080/dial?request=clientip&protocol=http&host={{ item.1.pod }}&port=8080&tries=1'
        | jq -r '.responses[0] // .errors[0]' | cut -d: -f1
      loop: "{{ clusters | product(clusters) | list }}"
      loop_control:
        label: "{{ item.0.name }} pod {{ item.0.pod }} -> {{ item.1.name }} pod {{ item.1.pod }}"
      when: item.0.name != item.1.name
      register: no_snat
      changed_when: false
      failed_when: no_snat.stdout != item.0.pod

    - name: Run checks of the public edge from the host
      ansible.builtin.shell: sh -s
      args:
        stdin: "{{ lookup('template', '../templates/ingress-check.sh.j2') }}"
      register: edge_checks
      changed_when: false

    - name: Results
      ansible.builtin.debug:
        msg: "{{ checks.results | map(attribute='stdout_lines') | zip(clusters | map(attribute='name')) | map('reverse') | community.general.dict
                 | combine({'edge': edge_checks.stdout_lines}) }}"

    - name: Remove test services
      ansible.builtin.command: kubectl --kubeconfig {{ item.kubeconfig }} delete namespace network-test --wait=false
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: All checks passed
      ansible.builtin.assert:
        that: (checks.results | map(attribute='stdout') | list + [edge_checks.stdout]) | select('search', 'FAIL') | list | length == 0
        fail_msg: Some network checks failed, see Results above.
        quiet: true
