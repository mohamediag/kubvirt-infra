# Downloads pinned upstream manifests into platform/*/upstream so the repo is
# self-contained and diffs show exactly what changes on upgrade.
- name: Vendor upstream manifests
  hosts: all
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    manifests:
      - url: https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
        dest: platform/gateway-api/upstream/standard-install.yaml
      - url: https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset-thick.yml
        dest: platform/multus/upstream/multus-daemonset-thick.yaml
      - url: https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/kubevirt-operator.yaml
        dest: platform/kubevirt/operator/upstream/kubevirt-operator.yaml
      - url: https://github.com/kubevirt/containerized-data-importer/releases/download/{{ cdi_version }}/cdi-operator.yaml
        dest: platform/cdi/operator/upstream/cdi-operator.yaml
  tasks:
    - name: Download manifests
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ repo_root }}/{{ item.dest }}"
        force: true
        mode: "0644"
      loop: "{{ manifests }}"

    # The release manifest points at a moving "snapshot" tag.
    - name: Pin the Multus image to the vendored release
      ansible.builtin.replace:
        path: "{{ repo_root }}/platform/multus/upstream/multus-daemonset-thick.yaml"
        regexp: 'multus-cni:snapshot-thick'
        replace: 'multus-cni:{{ multus_version }}-thick'
