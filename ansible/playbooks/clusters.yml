# Installs the KubernetesCluster API and applies every clusters/<name>/ definition
# (state=present, default), or deletes all workload clusters (state=absent).
- name: Workload clusters
  hosts: all
  become: true
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    state: present
    ready_timeout: 1800s
    ssh: >-
      ssh -i {{ vm_ssh_key }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes -o ConnectTimeout=5
    gateway_api_crds: "{{ repo_root }}/tenants/gateway-api/standard-install.yaml"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Find cluster definitions
      ansible.builtin.find:
        paths: "{{ repo_root }}/clusters"
        patterns: cluster.yaml
        recurse: true
      register: cluster_files

    - name: Load cluster definitions
      ansible.builtin.set_fact:
        clusters: "{{ clusters | default([]) + [{'dir': item.path | dirname, 'xr': lookup('file', item.path) | from_yaml}] }}"
      loop: "{{ cluster_files.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"

    - name: Delete clusters
      when: state == "absent"
      block:
        - name: Delete KubernetesClusters
          ansible.builtin.command: >-
            kubectl -n {{ item.xr.metadata.namespace }} delete kubernetescluster {{ item.xr.metadata.name }}
            --ignore-not-found --wait=true --timeout=600s
          loop: "{{ clusters }}"
          loop_control:
            label: "{{ item.xr.metadata.name }}"
          changed_when: true

        - name: Delete cluster namespaces
          ansible.builtin.command: kubectl delete -f {{ item.dir }}/namespace.yaml --ignore-not-found --wait=true --timeout=600s
          loop: "{{ clusters }}"
          loop_control:
            label: "{{ item.xr.metadata.name }}"
          changed_when: true

        - name: Remove kubeconfigs
          ansible.builtin.file:
            path: /root/.kube/{{ item.xr.metadata.name }}.kubeconfig
            state: absent
          loop: "{{ clusters }}"
          loop_control:
            label: "{{ item.xr.metadata.name }}"

        - name: Rebuild the merged kubeconfig
          ansible.builtin.command: /usr/local/bin/kubeconfig-merge
          changed_when: true

        - name: Stop here when deleting
          ansible.builtin.meta: end_play

    # site.yml is the fabric's policy (FRR filters, firewall); host.yml
    # checks that its ranges are unique.
    - name: Each cluster must match its network on the host (site.yml vm_networks)
      ansible.builtin.assert:
        that:
          - site | length == 1
          - site[0].vlan_id == net.vlanId
          - site[0].cidr == net.subnet
          - site[0].asn == net.asn
          - site[0].pod_cidr == net.podCIDR
          - site[0].lb_cidr == net.loadBalancerCIDR
        fail_msg: >-
          {{ item.xr.metadata.name }}: vlanId {{ net.vlanId }}, subnet {{ net.subnet }}, asn {{ net.asn }},
          podCIDR {{ net.podCIDR }}, loadBalancerCIDR {{ net.loadBalancerCIDR }} do not match the
          vm_networks entry named {{ item.xr.metadata.name }} (its bridge is br-{{ item.xr.metadata.name }}).
          Fix ansible/group_vars/all/site.yml and run `make host`, or fix the cluster.
        quiet: true
      vars:
        net: "{{ item.xr.spec.network }}"
        site: "{{ vm_networks | selectattr('name', 'equalto', item.xr.metadata.name) | list }}"
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.xr.metadata.name }}"

    - name: VLANs and Cilium cluster IDs must be unique across clusters
      ansible.builtin.assert:
        that:
          - vlans | unique | length == vlans | length
          - ids | unique | length == ids | length
        fail_msg: "Duplicate vlanId {{ vlans }} or cilium.clusterId {{ ids }} in clusters/*/cluster.yaml"
        quiet: true
      vars:
        vlans: "{{ clusters | map(attribute='xr.spec.network.vlanId') | list }}"
        ids: "{{ clusters | map(attribute='xr.spec.cilium.clusterId') | list }}"

    - name: KubernetesCluster API
      ansible.builtin.command: kubectl apply --server-side --force-conflicts -k {{ repo_root }}/crossplane
      changed_when: false

    - name: Checksum of the vendored Gateway API CRDs
      ansible.builtin.stat:
        path: "{{ gateway_api_crds }}"
        checksum_algorithm: sha256
      register: gateway_api_crds_stat

    - name: Fabric settings for the composition (EnvironmentConfig "fabric")
      ansible.builtin.command:
        cmd: kubectl apply --server-side -f -
        stdin: "{{ fabric | to_json }}"
      vars:
        fabric:
          apiVersion: apiextensions.crossplane.io/v1beta1
          kind: EnvironmentConfig
          metadata: {name: fabric}
          data:
            asn: "{{ fabric_asn | int }}"
            routedCIDRs: ["{{ fabric_routed_cidr }}"]
            mtu: "{{ vm_mtu | int }}"
            # Nodes download the release and check it against the vendored copy.
            gatewayAPI:
              url: https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
              sha256: "{{ gateway_api_crds_stat.stat.checksum }}"
            # What HAProxy on the host sends to each cluster (haproxy.cfg.j2).
            ingress: "{{ ingress }}"
        ingress: >-
          {%- set out = {} -%}
          {%- for t in vm_networks -%}
          {%- set _ = out.update({t.name: {
                'domain': t.domain,
                'address': t.lb_cidr | ansible.utils.ipaddr('-2') | ansible.utils.ipaddr('address'),
                'pool': {'start': t.lb_cidr | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address'),
                         'stop': t.lb_cidr | ansible.utils.ipaddr('-3') | ansible.utils.ipaddr('address')}}}) -%}
          {%- endfor -%}
          {{ out }}
      changed_when: false

    - name: Wait for the API to be established
      ansible.builtin.command: kubectl wait xrd/kubernetesclusters.platform.kubvirt-infra.io --for=condition=Established --timeout=300s
      changed_when: false

    - name: Read SSH public keys
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: ["{{ vm_ssh_key }}.pub", "{{ vm_authorized_keys_file }}"]
      register: keys

    - name: Collect keys
      ansible.builtin.set_fact:
        vm_ssh_keys: >-
          {{ keys.results | map(attribute='content') | map('b64decode')
             | map('split', '\n') | flatten | map('trim')
             | select('match', '^(ssh-|ecdsa-|sk-)') | unique | list }}

    - name: Namespaces and quotas
      ansible.builtin.command: kubectl apply --server-side -f {{ item.dir }}/namespace.yaml
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.xr.metadata.name }}"
      changed_when: false

    # Lets the kubeconfig Job SSH to the control plane. Never committed.
    - name: SSH key for the kubeconfig Job
      ansible.builtin.shell: |
        kubectl -n {{ item.xr.metadata.namespace }} create secret generic vm-ssh-key \
          --from-file=id_ed25519={{ vm_ssh_key }} --dry-run=client -o yaml | kubectl apply --server-side -f -
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.xr.metadata.name }}"
      changed_when: false

    - name: Clusters
      ansible.builtin.command:
        cmd: kubectl apply --server-side -f -
        stdin: "{{ item.xr | combine({'spec': {'sshAuthorizedKeys': vm_ssh_keys}}, recursive=true) | to_json }}"
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.xr.metadata.name }}"
      changed_when: false

    - name: Wait for the clusters to be Ready
      ansible.builtin.command: >-
        kubectl -n {{ item.xr.metadata.namespace }} wait kubernetescluster/{{ item.xr.metadata.name }}
        --for=condition=Ready --timeout={{ ready_timeout }}
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.xr.metadata.name }}"
      changed_when: false

    - name: Running clusters and their control planes
      ansible.builtin.set_fact:
        running: >-
          {%- set out = [] -%}
          {%- for c in clusters if c.xr.spec.running | default(true) -%}
          {%- set n = c.xr.spec.network -%}
          {%- set _ = out.append({'name': c.xr.metadata.name, 'namespace': c.xr.metadata.namespace,
                                  'cp': n.subnet | ansible.utils.ipaddr(n.nodeIPStart | default(10)) | ansible.utils.ipaddr('address')}) -%}
          {%- endfor -%}
          {{ out }}

    # cloud-init runs once: control planes created by an earlier composition
    # get its node files (Cilium chart values, BGP and ingress manifests, the
    # add-on script) from their re-rendered cloud-init Secret, then run the
    # script, as a new control plane does at first boot.
    - name: Read the control planes' cloud-init
      ansible.builtin.command: >-
        kubectl -n {{ item.namespace }} get secret {{ item.name }}-cp-0-cloudinit
        -o jsonpath={.data.userdata}
      loop: "{{ running }}"
      loop_control:
        label: "{{ item.name }}"
      register: userdata
      changed_when: false

    - name: Node files of the control planes
      ansible.builtin.set_fact:
        node_files: >-
          {%- set out = [] -%}
          {%- for r in userdata.results -%}
          {%- for f in (r.stdout | b64decode | from_yaml).write_files
                if f.path is match('^(/etc/kubvirt-infra/|/usr/local/sbin/kubvirt-infra-|/var/lib/rancher/k3s/server/manifests/)') -%}
          {%- set _ = out.append({'cluster': r.item.name, 'cp': r.item.cp, 'path': f.path,
                                  'mode': f.permissions | default('0644'), 'content': f.content}) -%}
          {%- endfor -%}{%- endfor -%}
          {{ out }}

    - name: Update node files of the control planes
      ansible.builtin.shell: >-
        {{ ssh }} ubuntu@{{ item.cp }} sudo sh -c '"t=\$(mktemp); cat > \$t;
        if cmp -s \$t {{ item.path }}; then echo same; else install -D -m {{ item.mode }} \$t {{ item.path }}; echo changed; fi;
        rm -f \$t"'
      args:
        stdin: "{{ item.content }}"
        stdin_add_newline: false
      loop: "{{ node_files }}"
      loop_control:
        label: "{{ item.cluster }}: {{ item.path }}"
      register: node_file_updates
      changed_when: "'changed' in node_file_updates.stdout"

    - name: Apply the add-ons on the control planes
      ansible.builtin.shell: "{{ ssh }} ubuntu@{{ item.cp }} sudo timeout 600 /usr/local/sbin/kubvirt-infra-addons"
      loop: "{{ running }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Write kubeconfigs to /root/.kube/<cluster>.kubeconfig
      ansible.builtin.shell: |
        umask 077; mkdir -p /root/.kube
        kubectl -n {{ item.xr.metadata.namespace }} get secret {{ item.xr.metadata.name }}-kubeconfig -o jsonpath='{.data.kubeconfig}' | base64 -d > /root/.kube/{{ item.xr.metadata.name }}.kubeconfig
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.xr.metadata.name }}"
      changed_when: false

    - name: Merge them into /root/.kube/config (see host.yml)
      ansible.builtin.command: /usr/local/bin/kubeconfig-merge
      changed_when: false

    - name: Wait for the ingress Gateways
      ansible.builtin.command: >-
        kubectl --kubeconfig /root/.kube/{{ item.name }}.kubeconfig -n gateway
        wait gateway/ingress --for=condition=Programmed --timeout=600s
      loop: "{{ running }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Status
      ansible.builtin.command: kubectl get kubernetescluster -A
      register: xr_status
      changed_when: false

    - name: Result
      ansible.builtin.debug:
        msg: "{{ xr_status.stdout_lines }}"
