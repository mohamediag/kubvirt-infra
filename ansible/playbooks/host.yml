# Prepares the management host: packages, kernel settings, VM bridge + NAT,
# BGP fabric (FRR), firewall and CLI tools.
- name: Prepare management host
  hosts: all
  become: true
  tasks:
    - name: Upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: "yes"
      when: apt_upgrade

    - name: Install packages
      ansible.builtin.apt:
        name: [curl, jq, nftables, ufw, frr]

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Warn about pending reboot
      ansible.builtin.debug:
        msg: "A reboot is required to finish the upgrade. Reboot the host when convenient."
      when: reboot_required.stat.exists

    - name: Kernel settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-kubevirt-infra.conf
      loop: "{{ settings | dict2items }}"
      vars:
        settings:
          net.ipv4.ip_forward: 1
          # ECMP over workload nodes: hash on the 5-tuple, not only the IPs.
          net.ipv4.fib_multipath_hash_policy: 1
          fs.inotify.max_user_instances: 1024
          fs.inotify.max_user_watches: 1048576

    # --- VM networks -----------------------------------------------------
    # br-vms: untagged and host-local (smoke-test VM). Each workload cluster
    # has its own bridge br-<name> with the gateway .1; with vm_uplink set,
    # <vm_uplink>.<vlan_id> joins it and carries the cluster to other hosts.
    - name: VM networks (smoke-test bridge + one bridge per cluster)
      ansible.builtin.set_fact:
        vm_bridges: "{{ vm_bridges | default([{'iface': vm_bridge, 'cidr': vm_net_cidr}]) + [{'iface': 'br-' ~ item.name, 'cidr': item.cidr}] }}"
      loop: "{{ vm_networks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Routed address ranges
      ansible.builtin.set_fact:
        fabric_ranges: >-
          {{ [pod_cidr, service_cidr, vm_net_cidr]
             + vm_networks | map(attribute='cidr') | list
             + vm_networks | map(attribute='pod_cidr') | list
             + vm_networks | map(attribute='lb_cidr') | list }}

    - name: Cluster networks must be valid and unique (site.yml)
      ansible.builtin.assert:
        that:
          - vm_networks | map(attribute='name') | unique | length == vm_networks | length
          - vm_networks | map(attribute='vlan_id') | unique | length == vm_networks | length
          - (vm_networks | map(attribute='asn') | unique | list + [fabric_asn]) | unique | length == vm_networks | length + 1
          - bad_names == ''
          - bad_vlans == ''
          - bad_asns == ''
          - overlaps == ''
          - outside == ''
        fail_msg: >-
          Duplicate name, vlan_id or ASN; names not 1-12 lowercase alphanumerics or '-' [{{ bad_names }}];
          vlan_id outside {{ vm_vlan_id_range }} [{{ bad_vlans }}]; ASN not private [{{ bad_asns }}];
          overlapping ranges [{{ overlaps }}]; or pod/LB ranges outside fabric_routed_cidr [{{ outside }}].
        quiet: true
      vars:
        bad_names: >-
          {{ vm_networks | map(attribute='name') | reject('match', '^[a-z0-9]([-a-z0-9]{0,10}[a-z0-9])?$') | join(', ') }}
        bad_vlans: >-
          {%- set out = [] -%}
          {%- for n in vm_networks if n.vlan_id | int < vm_vlan_id_range[0] or n.vlan_id | int > vm_vlan_id_range[1] -%}
          {%- set _ = out.append(n.name ~ ': ' ~ n.vlan_id) -%}{%- endfor -%}
          {{ out | join(', ') }}
        # RFC 6996: 64512-65534 and 4200000000-4294967294.
        bad_asns: >-
          {%- set out = [] -%}
          {%- for a in vm_networks | map(attribute='asn') | list + [fabric_asn] -%}
          {%- if not ((64512 <= a | int <= 65534) or (4200000000 <= a | int <= 4294967294)) -%}{%- set _ = out.append(a) -%}{%- endif -%}
          {%- endfor -%}
          {{ out | join(', ') }}
        overlaps: >-
          {%- set out = [] -%}
          {%- for a in fabric_ranges -%}{%- for b in fabric_ranges[loop.index:] -%}
          {%- if a | ansible.utils.network_in_network(b) or b | ansible.utils.network_in_network(a) -%}
          {%- set _ = out.append(a ~ ' / ' ~ b) -%}
          {%- endif -%}{%- endfor -%}{%- endfor -%}
          {{ out | join(', ') }}
        outside: >-
          {%- set out = [] -%}
          {%- for r in vm_networks | map(attribute='pod_cidr') | list + vm_networks | map(attribute='lb_cidr') | list -%}
          {%- if not fabric_routed_cidr | ansible.utils.network_in_network(r) -%}{%- set _ = out.append(r) -%}{%- endif -%}
          {%- endfor -%}
          {{ out | join(', ') }}

    # FRR installs the BGP routes; networkd must not remove them (nor
    # Cilium's) when it reconfigures links.
    - name: networkd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/networkd.conf.d
        state: directory
        mode: "0755"

    - name: networkd leaves foreign routes alone
      ansible.builtin.copy:
        dest: /etc/systemd/networkd.conf.d/50-kubevirt-infra.conf
        content: |
          [Network]
          ManageForeignRoutes=no
          ManageForeignNextHops=no
      notify: Restart networkd

    - name: Apply networkd settings before FRR installs routes
      ansible.builtin.meta: flush_handlers

    - name: Smoke-test bridge
      ansible.builtin.copy:
        dest: /etc/systemd/network/{{ item.file }}
        content: "{{ item.content }}"
      loop:
        - file: 50-{{ vm_bridge }}.netdev
          content: |
            [NetDev]
            Name={{ vm_bridge }}
            Kind=bridge
        - file: 50-{{ vm_bridge }}.network
          content: |
            [Match]
            Name={{ vm_bridge }}

            [Link]
            RequiredForOnline=no

            [Network]
            Address={{ vm_net_gateway }}/{{ vm_net_prefix }}
            ConfigureWithoutCarrier=yes
            IgnoreCarrierLoss=yes
      loop_control:
        label: "{{ item.file }}"
      notify: Reload networkd

    - name: Cluster bridges
      ansible.builtin.copy:
        dest: /etc/systemd/network/50-br-{{ item.name }}.netdev
        content: |
          # {{ item.name }}
          [NetDev]
          Name=br-{{ item.name }}
          Kind=bridge
          MTUBytes={{ vm_mtu }}
      loop: "{{ vm_networks }}"
      loop_control:
        label: br-{{ item.name }}
      notify: Reload networkd

    - name: Cluster gateways
      ansible.builtin.copy:
        dest: /etc/systemd/network/50-br-{{ item.name }}.network
        content: |
          # {{ item.name }}
          [Match]
          Name=br-{{ item.name }}

          [Link]
          RequiredForOnline=no
          MTUBytes={{ vm_mtu }}

          [Network]
          Address={{ item.cidr | ansible.utils.ipaddr('1') }}
          ConfigureWithoutCarrier=yes
          IgnoreCarrierLoss=yes
          # Only sources routed through this bridge (its nodes, and the pod and
          # LB prefixes its nodes announce): no spoofing of other tenants.
          IPv4ReversePathFilter=strict
      loop: "{{ vm_networks }}"
      loop_control:
        label: br-{{ item.name }}
      notify: Reload networkd

    - name: Cluster VLANs on the uplink
      ansible.builtin.copy:
        dest: /etc/systemd/network/51-{{ vm_uplink }}.{{ item.vlan_id }}.netdev
        content: |
          # {{ item.name }} towards the other hosts
          [NetDev]
          Name={{ vm_uplink }}.{{ item.vlan_id }}
          Kind=vlan
          MTUBytes={{ vm_mtu }}

          [VLAN]
          Id={{ item.vlan_id }}
      loop: "{{ vm_networks }}"
      loop_control:
        label: "{{ vm_uplink }}.{{ item.vlan_id }}"
      when: vm_uplink != ''
      notify: Reload networkd

    - name: Cluster VLANs join their bridge
      ansible.builtin.copy:
        dest: /etc/systemd/network/51-{{ vm_uplink }}.{{ item.vlan_id }}.network
        content: |
          [Match]
          Name={{ vm_uplink }}.{{ item.vlan_id }}

          [Link]
          RequiredForOnline=no

          [Network]
          Bridge=br-{{ item.name }}
      loop: "{{ vm_networks }}"
      loop_control:
        label: "{{ vm_uplink }}.{{ item.vlan_id }}"
      when: vm_uplink != ''
      notify: Reload networkd

    # The uplink's own .network file (e.g. netplan's) must list its VLANs.
    - name: Find the uplink's network file
      ansible.builtin.shell: >-
        networkctl status {{ vm_uplink }} --no-pager | sed -n 's/^ *Network File: //p'
      register: uplink_network
      changed_when: false
      failed_when: uplink_network.stdout == ''
      when: vm_uplink != ''

    - name: Uplink drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/network/{{ uplink_network.stdout | basename }}.d
        state: directory
        mode: "0755"
      when: vm_uplink != ''

    - name: Attach the cluster VLANs to the uplink
      ansible.builtin.copy:
        dest: /etc/systemd/network/{{ uplink_network.stdout | basename }}.d/50-kubevirt-infra.conf
        content: |
          [Network]
          {% for n in vm_networks %}
          VLAN={{ vm_uplink }}.{{ n.vlan_id }}
          {% endfor %}
      when: vm_uplink != ''
      notify: Reload networkd

    - name: Find uplink drop-ins
      ansible.builtin.find:
        paths: /etc/systemd/network
        patterns: 50-kubevirt-infra.conf
        recurse: true
      register: uplink_dropins

    - name: Remove the drop-in of a former uplink
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ uplink_dropins.files | map(attribute='path')
           | reject('equalto', '/etc/systemd/network/' ~ (uplink_network.stdout | default('') | basename) ~ '.d/50-kubevirt-infra.conf' if vm_uplink else '')
           | list }}
      notify: Reload networkd

    - name: VM network files that should exist
      ansible.builtin.set_fact:
        vm_net_files: >-
          {{ ['50-' ~ vm_bridge ~ '.netdev', '50-' ~ vm_bridge ~ '.network']
             + vm_networks | map(attribute='name') | product(['.netdev', '.network'])
               | map('join') | map('regex_replace', '^', '50-br-') | list
             + (vm_networks | map(attribute='vlan_id') | map('string') | product(['.netdev', '.network'])
               | map('join') | map('regex_replace', '^', '51-' ~ vm_uplink ~ '.') | list if vm_uplink else []) }}

    # Files of removed clusters, an old uplink or the former VLAN layout
    # (br-vms.<id>). networkd does not delete netdevs, so their links go too.
    - name: Find VM network files
      ansible.builtin.find:
        paths: /etc/systemd/network
        patterns: ["50-*", "51-*"]
        file_type: file
      register: existing_net_files

    - name: Remove stale VM network files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ existing_net_files.files | map(attribute='path') | reject('in', vm_net_files | map('regex_replace', '^', '/etc/systemd/network/') | list) | list }}"
      register: stale_net_files
      notify: Reload networkd

    - name: Delete links of removed netdevs
      ansible.builtin.shell: ip link show {{ item }} >/dev/null 2>&1 && ip link delete {{ item }} || true
      loop: >-
        {{ stale_net_files.results | selectattr('changed') | map(attribute='item')
           | select('match', '.*\.netdev$') | map('basename')
           | map('regex_replace', '^5[01]-(.*)\.netdev$', '\1') | list }}
      changed_when: true

    # networkd does not change bridge options of an existing bridge.
    - name: Check VLAN filtering on the VM bridge
      ansible.builtin.slurp:
        src: /sys/class/net/{{ vm_bridge }}/bridge/vlan_filtering
      register: vlan_filtering
      failed_when: false

    - name: Recreate the VM bridge without VLAN filtering (former layout)
      ansible.builtin.command: ip link delete {{ vm_bridge }}
      when: (vlan_filtering.content | default('') | b64decode | trim) == '1'
      changed_when: true
      notify: Reload networkd

    - name: Bring up the VM bridges
      ansible.builtin.meta: flush_handlers

    - name: Check the VM bridges exist
      ansible.builtin.command: ip -br link show {{ item.iface }}
      loop: "{{ vm_bridges }}"
      loop_control:
        label: "{{ item.iface }}"
      register: bridges
      changed_when: false
      failed_when: false

    - name: Create the VM bridges
      ansible.builtin.command: networkctl reload
      when: bridges.results | rejectattr('rc', 'equalto', 0) | list | length > 0
      changed_when: true

    - name: nftables include directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        mode: "0755"

    - name: VM NAT ruleset
      ansible.builtin.copy:
        dest: /etc/nftables.d/vm-nat.nft
        content: |
          # Managed by kubevirt-infra. Only touches its own table.
          table ip vm_nat
          delete table ip vm_nat
          table ip vm_nat {
            chain postrouting {
              type nat hook postrouting priority srcnat; policy accept;
              # Only traffic leaving the host; traffic between clusters is routed as is.
              ip saddr { {{ vm_bridges | map(attribute='cidr') | join(', ') }} } oifname "{{ node_iface }}" masquerade
            }
          }
      notify: Restart vm-nat

    - name: VM NAT service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vm-nat.service
        content: |
          [Unit]
          Description=NAT for the KubeVirt VM network
          After=network-online.target ufw.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft -f /etc/nftables.d/vm-nat.nft
          ExecStop=/usr/sbin/nft delete table ip vm_nat

          [Install]
          WantedBy=multi-user.target
      notify: Restart vm-nat

    - name: Enable VM NAT service
      ansible.builtin.systemd_service:
        name: vm-nat
        enabled: true
        state: started
        daemon_reload: true

    # --- Firewall --------------------------------------------------------
    - name: Default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        default: "{{ item.policy }}"
      loop:
        - {direction: incoming, policy: deny}
        - {direction: outgoing, policy: allow}
        - {direction: routed, policy: deny}

    - name: Admin access
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1 | string }}"
      loop: "{{ admin_sources | product(admin_tcp_ports) | list }}"

    - name: Cluster networks may reach the host
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        comment: kubevirt-infra cluster network
      loop: ["{{ pod_cidr }}", "{{ service_cidr }}"]

    # Rules of the former layout (one VLAN-aware br-vms with br-vms.<id>
    # gateways, every cluster bridged on br-vms).
    - name: Remove firewall rules of the former VLAN layout
      ansible.builtin.shell: |
        changed=0
        while n=$(ufw status numbered | grep -E "$PATTERN" | head -1 | sed -E 's/^\[ *([0-9]+)\].*/\1/'); [ -n "$n" ]; do
          ufw --force delete "$n" >/dev/null; changed=1
        done
        echo $changed
      environment:
        PATTERN: >-
          on {{ vm_bridge }}\.[0-9]+|({{ (vm_networks | map(attribute='cidr') | list
          + vm_networks | map(attribute='pod_cidr') | list) | map('regex_escape') | join('|') }}) on {{ vm_bridge }}
      register: old_rules
      changed_when: old_rules.stdout == '1'

    # VMs never reach the host itself (incoming default deny) nor the
    # management cluster's pod/service networks.
    - name: VMs may not reach management cluster networks
      community.general.ufw:
        rule: deny
        route: true
        insert: 1
        from_ip: "{{ item.0.cidr }}"
        to_ip: "{{ item.1 }}"
        comment: kubevirt-infra VMs to mgmt
      loop: "{{ vm_bridges | product([pod_cidr, service_cidr]) | list }}"
      loop_control:
        label: "{{ item.0.iface }} -> {{ item.1 }}"

    - name: VMs may reach the internet
      community.general.ufw:
        rule: allow
        route: true
        interface_in: "{{ item.iface }}"
        interface_out: "{{ node_iface }}"
        from_ip: "{{ item.cidr }}"
        comment: kubevirt-infra VM egress
      loop: "{{ vm_bridges }}"
      loop_control:
        label: "{{ item.iface }}"

    # br_netfilter passes bridged frames through FORWARD as well.
    - name: VMs in the same network may reach each other
      community.general.ufw:
        rule: allow
        route: true
        interface_in: "{{ item.iface }}"
        interface_out: "{{ item.iface }}"
        from_ip: "{{ item.cidr }}"
        comment: kubevirt-infra VM egress
      loop: "{{ vm_bridges }}"
      loop_control:
        label: "{{ item.iface }}"

    # Same-cluster pod traffic between nodes is bridged (autoDirectNodeRoutes).
    - name: Pods of a cluster may reach each other
      community.general.ufw:
        rule: allow
        route: true
        interface_in: br-{{ item.name }}
        interface_out: br-{{ item.name }}
        from_ip: "{{ item.pod_cidr }}"
        comment: kubevirt-infra same-cluster pods
      loop: "{{ vm_networks }}"
      loop_control:
        label: br-{{ item.name }}

    # Between clusters: everything routed from one cluster bridge to another,
    # i.e. node IPs, pod IPs and LoadBalancer IPs, without NAT. Strict
    # rp_filter on br-<name> limits sources to the cluster's own prefixes.
    - name: Clusters may reach each other
      community.general.ufw:
        rule: allow
        route: true
        interface_in: br-{{ item.0.name }}
        interface_out: br-{{ item.1.name }}
        comment: kubevirt-infra inter-cluster
      loop: "{{ vm_networks | product(vm_networks) | list }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1.name }}"
      when: item.0.name != item.1.name

    - name: Workload nodes may open BGP sessions to their gateway
      community.general.ufw:
        rule: allow
        direction: in
        interface: br-{{ item.name }}
        proto: tcp
        from_ip: "{{ item.cidr }}"
        to_ip: "{{ item.cidr | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
        to_port: "179"
        comment: kubevirt-infra BGP
      loop: "{{ vm_networks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Pods may reach VMs
      community.general.ufw:
        rule: allow
        route: true
        from_ip: "{{ pod_cidr }}"
        to_ip: "{{ item.cidr }}"
        comment: kubevirt-infra pods to VMs
      loop: "{{ vm_bridges }}"
      loop_control:
        label: "{{ item.iface }}"

    - name: Pods may reach workload pods and LoadBalancer IPs
      community.general.ufw:
        rule: allow
        route: true
        from_ip: "{{ pod_cidr }}"
        to_ip: "{{ item }}"
        comment: kubevirt-infra pods to VMs
      loop: "{{ vm_networks | map(attribute='pod_cidr') | list + vm_networks | map(attribute='lb_cidr') | list }}"

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    # --- BGP fabric (FRR) ------------------------------------------------
    # Passive eBGP: every workload node connects to its VLAN gateway
    # (Cilium autoDiscovery DefaultGateway). The host accepts only the
    # cluster's pod CIDR and LoadBalancer /32s and announces nothing.
    - name: Enable bgpd
      ansible.builtin.lineinfile:
        path: /etc/frr/daemons
        regexp: ^bgpd=
        line: bgpd=yes
      notify: Restart frr

    - name: FRR configuration
      ansible.builtin.template:
        src: ../templates/frr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: "0640"
        validate: /usr/bin/vtysh --dryrun --inputfile %s
      notify: Reload frr

    - name: Enable FRR
      ansible.builtin.systemd_service:
        name: frr
        enabled: true
        state: started

    # --- Tools -----------------------------------------------------------
    - name: Check installed helm version
      ansible.builtin.command: /usr/local/bin/helm version --template {% raw %}'{{ .Version }}'{% endraw %}
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Install helm
      ansible.builtin.unarchive:
        src: https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: [linux-amd64/helm]
        extra_opts: [--strip-components=1]
      when: helm_installed.stdout != helm_version

    - name: Check installed CNI plugins version
      ansible.builtin.shell: /opt/cni/bin/bridge --version 2>/dev/null | awk '{print $NF}'
      register: cni_installed
      changed_when: false

    - name: CNI plugin directory
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    - name: Install CNI plugins (bridge etc. for Multus secondary networks)
      ansible.builtin.unarchive:
        src: https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz
        dest: /opt/cni/bin
        remote_src: true
      when: cni_installed.stdout != cni_plugins_version

    - name: Install virtctl
      ansible.builtin.get_url:
        url: https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/virtctl-{{ kubevirt_version }}-linux-amd64
        dest: /usr/local/bin/virtctl
        mode: "0755"
        force: true

    # One merged kubeconfig (kubectx does not support several files in
    # KUBECONFIG): the management cluster (context "default") plus every
    # workload cluster written to /root/.kube/<name>.kubeconfig by
    # `make clusters` / `make kubeconfig`. Rebuilt by kubeconfig-merge, which
    # keeps the current context.
    - name: Kubeconfig merge script
      ansible.builtin.copy:
        dest: /usr/local/bin/kubeconfig-merge
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by kubevirt-infra. Rebuilds {{ merged_kubeconfig }}.
          set -eu
          out={{ merged_kubeconfig }}
          current=$(kubectl --kubeconfig "$out" config current-context 2>/dev/null || echo default)
          files={{ kubeconfig }}
          for f in /root/.kube/*.kubeconfig; do
            [ -r "$f" ] && files="$files:$f"
          done
          umask 077
          mkdir -p "$(dirname "$out")"
          KUBECONFIG=$files kubectl config view --flatten > "$out.tmp"
          kubectl --kubeconfig "$out.tmp" config use-context "$current" >/dev/null 2>&1 ||
            kubectl --kubeconfig "$out.tmp" config use-context default >/dev/null
          mv "$out.tmp" "$out"

    # k3s rewrites its kubeconfig on restart and certificate rotation.
    - name: Rebuild the merged kubeconfig when k3s rewrites its own
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ item.name }}
        content: "{{ item.content }}"
      loop:
        - name: kubeconfig-merge.service
          content: |
            [Unit]
            Description=Merge kubeconfigs into {{ merged_kubeconfig }}

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/kubeconfig-merge
        - name: kubeconfig-merge.path
          content: |
            [Unit]
            Description=Watch {{ kubeconfig }}

            [Path]
            PathChanged={{ kubeconfig }}

            [Install]
            WantedBy=multi-user.target
      loop_control:
        label: "{{ item.name }}"

    - name: Enable kubeconfig merge watcher
      ansible.builtin.systemd_service:
        name: kubeconfig-merge.path
        enabled: true
        state: started
        daemon_reload: true

    - name: Build the merged kubeconfig
      ansible.builtin.command: /usr/local/bin/kubeconfig-merge
      when: kubeconfig is file
      changed_when: false

    - name: Export KUBECONFIG for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: "export KUBECONFIG={{ merged_kubeconfig }}\n"

    - name: SSH key used by the host to reach VMs
      community.crypto.openssh_keypair:
        path: "{{ vm_ssh_key }}"
        type: ed25519
        comment: kubevirt-infra@{{ inventory_hostname }}

  handlers:
    - name: Restart networkd
      ansible.builtin.systemd_service:
        name: systemd-networkd
        state: restarted

    - name: Restart frr
      ansible.builtin.systemd_service:
        name: frr
        state: restarted
      register: frr_restart

    # Applies the difference to the running daemons; BGP sessions stay up.
    # Not `systemctl reload frr`: it restarts watchfrr, which systemd takes
    # for a stop. A restart already loaded the new configuration.
    - name: Reload frr
      ansible.builtin.command: /usr/lib/frr/frr-reload.py --reload /etc/frr/frr.conf
      changed_when: true
      when: frr_restart is not defined or frr_restart is skipped

    # Creates new netdevs and reconfigures links whose .network changed.
    - name: Reload networkd
      ansible.builtin.command: networkctl reload
      changed_when: true

    - name: Restart vm-nat
      ansible.builtin.systemd_service:
        name: vm-nat
        state: restarted
        daemon_reload: true
