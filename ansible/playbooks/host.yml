# Prepares the management host: packages, kernel settings, VM bridge + NAT,
# firewall and CLI tools.
- name: Prepare management host
  hosts: all
  become: true
  tasks:
    - name: Upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: "yes"
      when: apt_upgrade

    - name: Install packages
      ansible.builtin.apt:
        name: [curl, jq, nftables, ufw]

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Warn about pending reboot
      ansible.builtin.debug:
        msg: "A reboot is required to finish the upgrade. Reboot the host when convenient."
      when: reboot_required.stat.exists

    - name: Kernel settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-kubevirt-infra.conf
      loop: "{{ settings | dict2items }}"
      vars:
        settings:
          net.ipv4.ip_forward: 1
          fs.inotify.max_user_instances: 1024
          fs.inotify.max_user_watches: 1048576

    # --- VM bridge -------------------------------------------------------
    # br-vms is VLAN-aware: each VM port is an access port of its cluster's
    # VLAN; the host has one gateway interface (br-vms.<id>) per VLAN.
    - name: VM networks (untagged + one per VLAN)
      ansible.builtin.set_fact:
        vm_networks: "{{ vm_networks | default([{'iface': vm_bridge, 'cidr': vm_net_cidr}]) + [{'iface': vm_bridge ~ '.' ~ item.id, 'cidr': item.cidr}] }}"
      loop: "{{ vm_vlans }}"

    - name: VM bridge netdev
      ansible.builtin.copy:
        dest: /etc/systemd/network/50-{{ vm_bridge }}.netdev
        content: |
          [NetDev]
          Name={{ vm_bridge }}
          Kind=bridge

          [Bridge]
          VLANFiltering=yes
          DefaultPVID=1
      notify: Reload networkd

    - name: VM bridge network
      ansible.builtin.copy:
        dest: /etc/systemd/network/50-{{ vm_bridge }}.network
        content: |
          [Match]
          Name={{ vm_bridge }}

          [Link]
          RequiredForOnline=no

          [Network]
          Address={{ vm_net_gateway }}/{{ vm_net_prefix }}
          ConfigureWithoutCarrier=yes
          IgnoreCarrierLoss=yes
          {% for vlan in vm_vlans %}
          VLAN={{ vm_bridge }}.{{ vlan.id }}
          {% endfor %}

          # Bridge "self" port: untagged network on PVID 1, tagged member of
          # every cluster VLAN so the gateway interfaces see their traffic.
          [BridgeVLAN]
          VLAN=1
          PVID=1
          EgressUntagged=1
          {% for vlan in vm_vlans %}

          [BridgeVLAN]
          VLAN={{ vlan.id }}
          {% endfor %}
      notify: Reload networkd

    - name: VLAN gateway netdevs
      ansible.builtin.copy:
        dest: /etc/systemd/network/51-{{ vm_bridge }}.{{ item.id }}.netdev
        content: |
          [NetDev]
          Name={{ vm_bridge }}.{{ item.id }}
          Kind=vlan

          [VLAN]
          Id={{ item.id }}
      loop: "{{ vm_vlans }}"
      notify: Reload networkd

    - name: VLAN gateway networks
      ansible.builtin.copy:
        dest: /etc/systemd/network/51-{{ vm_bridge }}.{{ item.id }}.network
        content: |
          # {{ item.name }}
          [Match]
          Name={{ vm_bridge }}.{{ item.id }}

          [Link]
          RequiredForOnline=no

          [Network]
          Address={{ item.cidr | ansible.utils.ipaddr('1') }}
          ConfigureWithoutCarrier=yes
          IgnoreCarrierLoss=yes
      loop: "{{ vm_vlans }}"
      notify: Reload networkd

    # networkd does not change bridge options of an existing bridge.
    - name: Check VLAN filtering on the VM bridge
      ansible.builtin.slurp:
        src: /sys/class/net/{{ vm_bridge }}/bridge/vlan_filtering
      register: vlan_filtering
      failed_when: false

    - name: Recreate the VM bridge with VLAN filtering
      ansible.builtin.command: ip link delete {{ vm_bridge }}
      when: (vlan_filtering.content | default('') | b64decode | trim) == '0'
      changed_when: true
      notify: Reload networkd

    - name: Bring up the VM bridge
      ansible.builtin.meta: flush_handlers

    - name: Check the VM bridge exists
      ansible.builtin.command: ip -br addr show {{ vm_bridge }}
      register: bridge
      changed_when: false
      failed_when: false

    - name: Create the VM bridge
      ansible.builtin.command: networkctl reload
      when: bridge.rc != 0
      changed_when: true

    - name: nftables include directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        mode: "0755"

    - name: VM NAT ruleset
      ansible.builtin.copy:
        dest: /etc/nftables.d/vm-nat.nft
        content: |
          # Managed by kubevirt-infra. Only touches its own table.
          table ip vm_nat
          delete table ip vm_nat
          table ip vm_nat {
            chain postrouting {
              type nat hook postrouting priority srcnat; policy accept;
              # Only traffic leaving the host; VLAN-to-VLAN traffic is routed as is.
              ip saddr { {{ vm_networks | map(attribute='cidr') | join(', ') }} } oifname "{{ node_iface }}" masquerade
            }
          }
      notify: Restart vm-nat

    - name: VM NAT service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vm-nat.service
        content: |
          [Unit]
          Description=NAT for the KubeVirt VM network
          After=network-online.target ufw.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft -f /etc/nftables.d/vm-nat.nft
          ExecStop=/usr/sbin/nft delete table ip vm_nat

          [Install]
          WantedBy=multi-user.target
      notify: Restart vm-nat

    - name: Enable VM NAT service
      ansible.builtin.systemd_service:
        name: vm-nat
        enabled: true
        state: started
        daemon_reload: true

    # --- Firewall --------------------------------------------------------
    - name: Default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        default: "{{ item.policy }}"
      loop:
        - {direction: incoming, policy: deny}
        - {direction: outgoing, policy: allow}
        - {direction: routed, policy: deny}

    - name: Admin access
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1 | string }}"
      loop: "{{ admin_sources | product(admin_tcp_ports) | list }}"

    - name: Cluster networks may reach the host
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        comment: kubevirt-infra cluster network
      loop: ["{{ pod_cidr }}", "{{ service_cidr }}"]

    # VMs never reach the host itself (incoming default deny) nor the
    # management cluster's pod/service networks.
    - name: VMs may not reach management cluster networks
      community.general.ufw:
        rule: deny
        route: true
        insert: 1
        from_ip: "{{ item.0.cidr }}"
        to_ip: "{{ item.1 }}"
        comment: kubevirt-infra VMs to mgmt
      loop: "{{ vm_networks | product([pod_cidr, service_cidr]) | list }}"

    - name: VMs may reach the internet
      community.general.ufw:
        rule: allow
        route: true
        interface_in: "{{ item.iface }}"
        interface_out: "{{ node_iface }}"
        from_ip: "{{ item.cidr }}"
        comment: kubevirt-infra VM egress
      loop: "{{ vm_networks }}"

    # br_netfilter passes bridged frames through FORWARD as well.
    - name: VMs in the same network may reach each other
      community.general.ufw:
        rule: allow
        route: true
        interface_in: "{{ vm_bridge }}"
        interface_out: "{{ vm_bridge }}"
        from_ip: "{{ item.cidr }}"
        comment: kubevirt-infra VM egress
      loop: "{{ vm_networks }}"

    - name: VMs in different VLANs may reach each other
      community.general.ufw:
        rule: allow
        route: true
        from_ip: "{{ item.0 }}"
        to_ip: "{{ item.1 }}"
        comment: kubevirt-infra inter-VLAN
      loop: "{{ vm_vlans | map(attribute='cidr') | product(vm_vlans | map(attribute='cidr')) | list }}"
      when: item.0 != item.1

    - name: Pods may reach VMs
      community.general.ufw:
        rule: allow
        route: true
        from_ip: "{{ pod_cidr }}"
        to_ip: "{{ item.cidr }}"
        comment: kubevirt-infra pods to VMs
      loop: "{{ vm_networks }}"

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    # --- Tools -----------------------------------------------------------
    - name: Check installed helm version
      ansible.builtin.command: /usr/local/bin/helm version --template {% raw %}'{{ .Version }}'{% endraw %}
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Install helm
      ansible.builtin.unarchive:
        src: https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: [linux-amd64/helm]
        extra_opts: [--strip-components=1]
      when: helm_installed.stdout != helm_version

    - name: Check installed CNI plugins version
      ansible.builtin.shell: /opt/cni/bin/bridge --version 2>/dev/null | awk '{print $NF}'
      register: cni_installed
      changed_when: false

    - name: CNI plugin directory
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    - name: Install CNI plugins (bridge etc. for Multus secondary networks)
      ansible.builtin.unarchive:
        src: https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz
        dest: /opt/cni/bin
        remote_src: true
      when: cni_installed.stdout != cni_plugins_version

    - name: Install virtctl
      ansible.builtin.get_url:
        url: https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/virtctl-{{ kubevirt_version }}-linux-amd64
        dest: /usr/local/bin/virtctl
        mode: "0755"
        force: true

    # One merged kubeconfig (kubectx does not support several files in
    # KUBECONFIG): the management cluster (context "default") plus every
    # workload cluster written to /root/.kube/<name>.kubeconfig by
    # `make clusters` / `make kubeconfig`. Rebuilt by kubeconfig-merge, which
    # keeps the current context.
    - name: Kubeconfig merge script
      ansible.builtin.copy:
        dest: /usr/local/bin/kubeconfig-merge
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by kubevirt-infra. Rebuilds {{ merged_kubeconfig }}.
          set -eu
          out={{ merged_kubeconfig }}
          current=$(kubectl --kubeconfig "$out" config current-context 2>/dev/null || echo default)
          files={{ kubeconfig }}
          for f in /root/.kube/*.kubeconfig; do
            [ -r "$f" ] && files="$files:$f"
          done
          umask 077
          mkdir -p "$(dirname "$out")"
          KUBECONFIG=$files kubectl config view --flatten > "$out.tmp"
          kubectl --kubeconfig "$out.tmp" config use-context "$current" >/dev/null 2>&1 ||
            kubectl --kubeconfig "$out.tmp" config use-context default >/dev/null
          mv "$out.tmp" "$out"

    # k3s rewrites its kubeconfig on restart and certificate rotation.
    - name: Rebuild the merged kubeconfig when k3s rewrites its own
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ item.name }}
        content: "{{ item.content }}"
      loop:
        - name: kubeconfig-merge.service
          content: |
            [Unit]
            Description=Merge kubeconfigs into {{ merged_kubeconfig }}

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/kubeconfig-merge
        - name: kubeconfig-merge.path
          content: |
            [Unit]
            Description=Watch {{ kubeconfig }}

            [Path]
            PathChanged={{ kubeconfig }}

            [Install]
            WantedBy=multi-user.target
      loop_control:
        label: "{{ item.name }}"

    - name: Enable kubeconfig merge watcher
      ansible.builtin.systemd_service:
        name: kubeconfig-merge.path
        enabled: true
        state: started
        daemon_reload: true

    - name: Build the merged kubeconfig
      ansible.builtin.command: /usr/local/bin/kubeconfig-merge
      when: kubeconfig is file
      changed_when: false

    - name: Export KUBECONFIG for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: "export KUBECONFIG={{ merged_kubeconfig }}\n"

    - name: SSH key used by the host to reach VMs
      community.crypto.openssh_keypair:
        path: "{{ vm_ssh_key }}"
        type: ed25519
        comment: kubevirt-infra@{{ inventory_hostname }}

  handlers:
    - name: Reload networkd
      ansible.builtin.shell: networkctl reload && networkctl reconfigure {{ vm_bridge }}
      changed_when: true

    - name: Restart vm-nat
      ansible.builtin.systemd_service:
        name: vm-nat
        state: restarted
        daemon_reload: true
