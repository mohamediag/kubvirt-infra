# Renders a KubernetesCluster into KubeVirt VMs that bootstrap k3s + Cilium
# with cloud-init. Everything is created in the XR's namespace. Cilium routes
# pods natively and announces pod CIDRs and LoadBalancer IPs over BGP to the
# fabric described by EnvironmentConfig "fabric", and implements the Gateway
# API: Gateway gateway/ingress is the cluster's public entry point (HAProxy on
# the host sends it the cluster's domain).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kubernetescluster-kubevirt-k3s
spec:
  compositeTypeRef:
    apiVersion: platform.kubvirt-infra.io/v1alpha1
    kind: KubernetesCluster
  mode: Pipeline
  pipeline:
    - step: fabric
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: fabric
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $spec := $xr.spec }}
            {{- $net := $spec.network }}
            {{- $observed := default (dict) .observed.resources }}
            {{- $o := splitList "." (trimSuffix "/24" $net.subnet) }}
            {{- $prefix := printf "%s.%s.%s" (index $o 0) (index $o 1) (index $o 2) }}
            {{- $start := int $net.nodeIPStart }}
            {{- $cpIP := printf "%s.%d" $prefix $start }}
            {{- $gateway := printf "%s.1" $prefix }}
            {{- $secretName := printf "%s-kubeconfig" $name }}
            {{- $fabric := index .context "apiextensions.crossplane.io/environment" }}
            {{- /* domain, address (Gateway "ingress") and the LoadBalancer pool
                   around it; absent: no ingress Gateway. */}}
            {{- $ingress := index (default (dict) $fabric.ingress) $name }}

            {{- /* Join token: generated once, then read back from the observed Secret. */}}
            {{- $token := randAlphaNum 48 }}
            {{- with index $observed "k3s-token" }}{{ $token = .resource.data.token | b64dec }}{{ end }}

            {{- $nodes := list (dict "name" (printf "%s-cp-0" $name) "role" "server" "ip" $cpIP
                  "cpu" $spec.controlPlane.cpu "memory" $spec.controlPlane.memory "disk" $spec.controlPlane.diskSize) }}
            {{- range $i := until (int $spec.workers.replicas) }}
            {{- $nodes = append $nodes (dict "name" (printf "%s-worker-%d" $name $i) "role" "agent"
                  "ip" (printf "%s.%d" $prefix (add $start 1 $i))
                  "cpu" $spec.workers.cpu "memory" $spec.workers.memory "disk" $spec.workers.diskSize) }}
            {{- end }}
            {{- $desired := len $nodes }}
            ---
            # Secondary network: a port on the cluster's own bridge br-<name>
            # (one per host, ansible/playbooks/host.yml).
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: vm-net
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-net
                gotemplating.fn.crossplane.io/ready: "True"  # no status to wait for
            spec:
              config: |
                {"cniVersion": "0.3.1", "name": "vm-net", "type": "bridge", "bridge": "br-{{ $name }}",
                 "mtu": {{ int $fabric.mtu }}, "macspoofchk": true, "ipam": {}}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-k3s-token
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: k3s-token
                gotemplating.fn.crossplane.io/ready: "True"  # no status to wait for
            type: Opaque
            data:
              token: {{ $token | b64enc }}
            {{- range $node := $nodes }}
            {{- $ipo := splitList "." $node.ip }}
            {{- $mac := printf "02:00:%02x:%02x:%02x:%02x" (atoi (index $ipo 0)) (atoi (index $ipo 1)) (atoi (index $ipo 2)) (atoi (index $ipo 3)) }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $node.name }}-cloudinit
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cloudinit-{{ $node.name }}
                gotemplating.fn.crossplane.io/ready: "True"
            type: Opaque
            stringData:
              networkdata: |
                version: 2
                ethernets:
                  eth0:
                    match:
                      macaddress: "{{ $mac }}"
                    set-name: eth0
                    # Fits a Hetzner vSwitch, and VXLAN over it, between hosts.
                    mtu: {{ int $fabric.mtu }}
                    addresses: [{{ $node.ip }}/24]
                    routes:
                      - to: default
                        via: {{ $gateway }}
                    nameservers:
                      addresses: {{ $net.dns | toJson }}
              userdata: |
                #cloud-config
                hostname: {{ $node.name }}
                ssh_pwauth: false
                users:
                  - name: ubuntu
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    ssh_authorized_keys: {{ $spec.sshAuthorizedKeys | toJson }}
                packages: [qemu-guest-agent]
                write_files:
                  - path: /etc/rancher/k3s/config.yaml
                    permissions: "0600"
                    content: |
                      token: {{ $token }}
                      node-ip: {{ $node.ip }}
                      {{- if eq $node.role "server" }}
                      cluster-init: true
                      advertise-address: {{ $node.ip }}
                      tls-san: [{{ $node.ip }}]
                      cluster-cidr: {{ $net.podCIDR }}
                      service-cidr: {{ $net.serviceCIDR }}
                      write-kubeconfig-mode: "0600"
                      flannel-backend: none
                      disable-network-policy: true
                      disable-kube-proxy: true
                      disable: [traefik, servicelb]
                      {{- else }}
                      server: https://{{ $cpIP }}:6443
                      {{- end }}
                  {{- if eq $node.role "server" }}
                  # Installed by k3s's helm-controller before any CNI exists.
                  - path: /var/lib/rancher/k3s/server/manifests/cilium.yaml
                    content: |
                      apiVersion: helm.cattle.io/v1
                      kind: HelmChart
                      metadata:
                        name: cilium
                        namespace: kube-system
                      spec:
                        repo: https://helm.cilium.io
                        chart: cilium
                        version: {{ $spec.cilium.version }}
                        targetNamespace: kube-system
                        bootstrap: true
                        valuesContent: |-
                          kubeProxyReplacement: true
                          k8sServiceHost: {{ $cpIP }}
                          k8sServicePort: 6443
                          cluster:
                            name: {{ $name }}
                            id: {{ int $spec.cilium.clusterId }}
                          ipam:
                            mode: cluster-pool
                            operator:
                              clusterPoolIPv4PodCIDRList: [{{ $net.podCIDR }}]
                          operator:
                            replicas: 1
                            rollOutPods: true
                          devices: [eth0]
                          # No overlay: nodes of the cluster route pod blocks to
                          # each other on their bridge, everything else goes to the
                          # fabric, which learns the pod blocks over BGP.
                          routingMode: native
                          ipv4NativeRoutingCIDR: {{ $net.podCIDR }}
                          autoDirectNodeRoutes: true
                          bpf:
                            masquerade: true
                          # Pods keep their IP towards the routed range (other
                          # clusters' pods and LoadBalancer IPs); the rest is
                          # masqueraded to the node IP.
                          ipMasqAgent:
                            enabled: true
                            config:
                              nonMasqueradeCIDRs: {{ $fabric.routedCIDRs | toJson }}
                              masqLinkLocal: false
                          bgpControlPlane:
                            enabled: true
                          # Consistent backend selection on every node, so ECMP
                          # from the fabric may land anywhere.
                          loadBalancer:
                            algorithm: maglev
                          externalIPs:
                            enabled: true
                          k8sClientRateLimit:
                            qps: 50
                            burst: 100
                          # HAProxy on the host is the one proxy in front: its
                          # X-Forwarded-For is kept.
                          gatewayAPI:
                            enabled: true
                            xffNumTrustedHops: 1
                            # Not "auto", which skips the GatewayClass when the
                            # CRDs are missing at render time: helm-controller
                            # retries until they exist instead.
                            gatewayClass:
                              create: "true"
                          # Configuration changes restart the pods.
                          rollOutCiliumPods: true
                          envoy:
                            rollOutPods: true
                          hubble:
                            relay:
                              enabled: true
                  # Every node peers with its default gateway (the fabric) and
                  # announces its pod block and all LoadBalancer IPs.
                  - path: /etc/kubvirt-infra/cilium-bgp.yaml
                    content: |
                      apiVersion: cilium.io/v2
                      kind: CiliumLoadBalancerIPPool
                      metadata:
                        name: fabric
                      spec:
                        {{- if $ingress }}
                        blocks:
                          - {start: "{{ $ingress.pool.start }}", stop: "{{ $ingress.pool.stop }}"}
                        {{- else }}
                        # .0 and .255 confuse some clients.
                        allowFirstLastIPs: "No"
                        blocks:
                          - cidr: {{ $net.loadBalancerCIDR }}
                        {{- end }}
                      ---
                      {{- if $ingress }}
                      # Reserved for Gateway gateway/ingress, HAProxy's target.
                      apiVersion: cilium.io/v2
                      kind: CiliumLoadBalancerIPPool
                      metadata:
                        name: ingress
                      spec:
                        blocks:
                          - cidr: {{ $ingress.address }}/32
                        serviceSelector:
                          matchLabels:
                            io.kubernetes.service.namespace: gateway
                            gateway.networking.k8s.io/gateway-name: ingress
                      ---
                      {{- end }}
                      apiVersion: cilium.io/v2
                      kind: CiliumBGPClusterConfig
                      metadata:
                        name: fabric
                      spec:
                        # Label a node bgp.kubvirt-infra.io/drain before
                        # maintenance: its routes are withdrawn at once instead
                        # of being kept for the graceful-restart time.
                        nodeSelector:
                          matchExpressions:
                            - {key: bgp.kubvirt-infra.io/drain, operator: DoesNotExist}
                        bgpInstances:
                          - name: fabric
                            localASN: {{ int64 $net.asn }}
                            peers:
                              - name: gateway
                                peerASN: {{ int64 $fabric.asn }}
                                autoDiscovery:
                                  mode: DefaultGateway
                                  defaultGateway: {addressFamily: ipv4}
                                peerConfigRef: {name: fabric}
                      ---
                      apiVersion: cilium.io/v2
                      kind: CiliumBGPPeerConfig
                      metadata:
                        name: fabric
                      spec:
                        # A dead node is withdrawn after the hold time (no BFD in
                        # Cilium OSS; the fabric ignores graceful restart then).
                        timers:
                          connectRetryTimeSeconds: 5
                          holdTimeSeconds: 9
                          keepAliveTimeSeconds: 3
                        # The fabric keeps the routes while the agent restarts
                        # (measured 30-56s). A node that shuts down also closes
                        # the session cleanly: drain it first (above).
                        gracefulRestart:
                          enabled: true
                          restartTimeSeconds: 120
                        families:
                          - afi: ipv4
                            safi: unicast
                            advertisements:
                              matchLabels: {advertise: fabric}
                      ---
                      apiVersion: cilium.io/v2
                      kind: CiliumBGPAdvertisement
                      metadata:
                        name: fabric
                        labels: {advertise: fabric}
                      spec:
                        advertisements:
                          - advertisementType: PodCIDR
                          # All LoadBalancer services, unless labelled
                          # bgp.kubvirt-infra.io/skip.
                          - advertisementType: Service
                            service:
                              addresses: [LoadBalancerIP]
                            selector:
                              matchExpressions:
                                - {key: bgp.kubvirt-infra.io/skip, operator: DoesNotExist}
                  {{- if $ingress }}
                  # The tenant attaches HTTPRoutes from any namespace and may
                  # replace the placeholder certificate gateway/ingress-tls
                  # (e.g. with cert-manager).
                  - path: /etc/kubvirt-infra/ingress.yaml
                    content: |
                      apiVersion: v1
                      kind: Namespace
                      metadata:
                        name: gateway
                      ---
                      apiVersion: gateway.networking.k8s.io/v1
                      kind: Gateway
                      metadata:
                        name: ingress
                        namespace: gateway
                      spec:
                        gatewayClassName: cilium
                        addresses:
                          - {type: IPAddress, value: {{ $ingress.address }}}
                        listeners:
                          - name: http
                            protocol: HTTP
                            port: 80
                            allowedRoutes:
                              namespaces: {from: All}
                          - name: https
                            protocol: HTTPS
                            port: 443
                            tls:
                              mode: Terminate
                              certificateRefs: [{name: ingress-tls}]
                            allowedRoutes:
                              namespaces: {from: All}
                  {{- end }}
                  # Run at first boot and by `make clusters` (which first updates
                  # the files above on running control planes).
                  - path: /usr/local/sbin/kubvirt-infra-addons
                    permissions: "0755"
                    content: |
                      #!/bin/sh
                      # Managed by kubevirt-infra. Idempotent. With "crds": only
                      # install the Gateway API CRDs, before k3s starts Cilium
                      # (its chart and operator need them).
                      set -eu
                      K="k3s kubectl"
                      crds=/var/lib/rancher/k3s/server/manifests/00-gateway-api.yaml
                      if ! echo "{{ $fabric.gatewayAPI.sha256 }}  $crds" | sha256sum -c --status 2>/dev/null; then
                        mkdir -p "$(dirname "$crds")"
                        curl -fsSL --retry 5 -o "$crds.tmp" {{ $fabric.gatewayAPI.url }}
                        if ! echo "{{ $fabric.gatewayAPI.sha256 }}  $crds.tmp" | sha256sum -c --status; then
                          echo "Gateway API CRDs: checksum mismatch" >&2; rm -f "$crds.tmp"; exit 1
                        fi
                        mv "$crds.tmp" "$crds"
                      fi
                      [ "${1:-}" != crds ] || exit 0

                      until $K get crd ciliumloadbalancerippools.cilium.io ciliumbgpclusterconfigs.cilium.io ciliumbgppeerconfigs.cilium.io ciliumbgpadvertisements.cilium.io >/dev/null 2>&1; do sleep 5; done
                      $K apply -f /etc/kubvirt-infra/cilium-bgp.yaml
                      {{- if $ingress }}

                      until $K get gatewayclass cilium >/dev/null 2>&1; do sleep 5; done
                      # The operator looks for the CRDs only at start: one that
                      # started before them never accepts the class.
                      if ! $K wait gatewayclass/cilium --for=condition=Accepted --timeout=60s >/dev/null 2>&1; then
                        $K -n kube-system rollout restart deployment/cilium-operator
                        $K wait gatewayclass/cilium --for=condition=Accepted --timeout=300s
                      fi
                      $K apply -f /etc/kubvirt-infra/ingress.yaml
                      # Placeholder until the tenant installs its own certificate.
                      if ! $K -n gateway get secret ingress-tls >/dev/null 2>&1; then
                        d=$(mktemp -d)
                        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 825 \
                          -subj "/CN=*.{{ $ingress.domain }}" -addext "subjectAltName=DNS:{{ $ingress.domain }},DNS:*.{{ $ingress.domain }}" \
                          -keyout "$d/tls.key" -out "$d/tls.crt" 2>/dev/null
                        $K -n gateway create secret tls ingress-tls --cert="$d/tls.crt" --key="$d/tls.key"
                        rm -rf "$d"
                      fi
                      {{- end }}
                  {{- end }}
                runcmd:
                  - systemctl enable --now qemu-guest-agent
                  {{- if eq $node.role "server" }}
                  - /usr/local/sbin/kubvirt-infra-addons crds
                  {{- end }}
                  - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ $spec.k3sVersion }} sh -s - {{ $node.role }}
                  {{- if eq $node.role "server" }}
                  - /usr/local/sbin/kubvirt-infra-addons
                  {{- end }}
            ---
            apiVersion: kubevirt.io/v1
            kind: VirtualMachine
            metadata:
              name: {{ $node.name }}
              namespace: {{ $ns }}
              labels:
                platform.kubvirt-infra.io/cluster: {{ $name }}
                platform.kubvirt-infra.io/role: {{ $node.role }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-{{ $node.name }}
                {{- if not $spec.running }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              runStrategy: {{ if $spec.running }}Always{{ else }}Halted{{ end }}
              dataVolumeTemplates:
                - metadata:
                    name: {{ $node.name }}-root
                  spec:
                    source:
                      pvc:
                        namespace: vm-images
                        name: ubuntu-2404
                    storage:
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: {{ $node.disk }}
              template:
                metadata:
                  labels:
                    platform.kubvirt-infra.io/cluster: {{ $name }}
                    platform.kubvirt-infra.io/node: {{ $node.name }}
                spec:
                  domain:
                    cpu:
                      cores: {{ int $node.cpu }}
                    memory:
                      guest: {{ $node.memory }}
                    devices:
                      disks:
                        - name: root
                          disk: {bus: virtio}
                        - name: cloudinit
                          disk: {bus: virtio}
                      interfaces:
                        - name: vmnet
                          bridge: {}
                          macAddress: "{{ $mac }}"
                  # Only the cluster network: the guest has a single NIC on br-<name>.
                  networks:
                    - name: vmnet
                      multus:
                        networkName: vm-net
                  volumes:
                    - name: root
                      dataVolume:
                        name: {{ $node.name }}-root
                    - name: cloudinit
                      cloudInitNoCloud:
                        secretRef:
                          name: {{ $node.name }}-cloudinit
                        networkDataSecretRef:
                          name: {{ $node.name }}-cloudinit
            {{- end }}
            ---
            # Fetches the kubeconfig from the control plane once it exists.
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: {{ $secretName }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kubeconfig-sa
                gotemplating.fn.crossplane.io/ready: "True"  # no status to wait for
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: {{ $secretName }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kubeconfig-role
                gotemplating.fn.crossplane.io/ready: "True"  # no status to wait for
            rules:
              - apiGroups: [""]
                resources: [secrets]
                verbs: [get, create, patch]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ $secretName }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kubeconfig-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"  # no status to wait for
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: {{ $secretName }}
            subjects:
              - kind: ServiceAccount
                name: {{ $secretName }}
                namespace: {{ $ns }}
            {{- /* The node count is part of the Job's identity: Job templates are
                   immutable, so scaling replaces the Job with one waiting for the new count. */}}
            {{- $jobKey := printf "kubeconfig-job-%d" $desired }}
            {{- $job := index $observed $jobKey }}
            {{- $jobDone := and $job (ge (int (default 0 $job.resource.status.succeeded)) 1) }}
            ---
            # Waits until all nodes are Ready, then stores the kubeconfig. XR
            # readiness therefore means "the Kubernetes cluster is up".
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ $secretName }}-{{ $desired }}nodes
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $jobKey }}
                gotemplating.fn.crossplane.io/ready: "{{ if $jobDone }}True{{ else }}False{{ end }}"
            spec:
              backoffLimit: 20
              template:
                spec:
                  serviceAccountName: {{ $secretName }}
                  restartPolicy: OnFailure
                  containers:
                    - name: fetch
                      image: alpine:3.22
                      env:
                        - {name: CLUSTER, value: {{ $name }}}
                        - {name: CP_IP, value: "{{ $cpIP }}"}
                        - {name: SECRET, value: {{ $secretName }}}
                        - {name: NS, value: {{ $ns }}}
                        - {name: NODES, value: "{{ $desired }}"}
                      command:
                        - sh
                        - -ec
                        - |
                          apk add --no-cache openssh-client curl >/dev/null
                          SSH="ssh -i /ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=yes ubuntu@$CP_IP"
                          until $SSH 'sudo test -s /etc/rancher/k3s/k3s.yaml' 2>/dev/null; do echo "waiting for $CP_IP"; sleep 10; done
                          until [ "$($SSH 'sudo k3s kubectl get nodes --no-headers 2>/dev/null' | awk '$2 == "Ready"' | wc -l)" -ge "$NODES" ]; do
                            echo "waiting for $NODES Ready nodes"; sleep 10
                          done
                          $SSH 'sudo cat /etc/rancher/k3s/k3s.yaml' \
                            | sed -E "s#https://127.0.0.1:6443#https://$CP_IP:6443#; s#(name|cluster|user|current-context): default\$#\1: $CLUSTER#" > /tmp/kubeconfig
                          SA=/var/run/secrets/kubernetes.io/serviceaccount
                          printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s"},"type":"Opaque","data":{"kubeconfig":"%s"}}' \
                            "$SECRET" "$NS" "$(base64 < /tmp/kubeconfig | tr -d '\n')" > /tmp/secret.json
                          curl -fsS --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
                            -H 'Content-Type: application/apply-patch+yaml' -X PATCH --data-binary @/tmp/secret.json \
                            "https://kubernetes.default.svc/api/v1/namespaces/$NS/secrets/$SECRET?fieldManager=kubeconfig-job&force=true" >/dev/null
                          echo "kubeconfig stored in $NS/$SECRET"
                      resources:
                        requests: {cpu: 50m, memory: 64Mi}
                        limits: {memory: 256Mi}
                      volumeMounts:
                        - {name: ssh, mountPath: /ssh, readOnly: true}
                  volumes:
                    - name: ssh
                      secret:
                        secretName: vm-ssh-key
                        defaultMode: 256  # 0400
            {{- $running := 0 }}
            {{- range $node := $nodes }}
            {{- with index $observed (printf "vm-%s" $node.name) }}
            {{- if .resource.status.ready }}{{ $running = add $running 1 }}{{ end }}
            {{- end }}
            {{- end }}
            ---
            apiVersion: platform.kubvirt-infra.io/v1alpha1
            kind: KubernetesCluster
            status:
              phase: {{ if not $spec.running }}Stopped{{ else if and (eq (int $running) $desired) $jobDone }}Ready{{ else }}Provisioning{{ end }}
              apiEndpoint: https://{{ $cpIP }}:6443
              kubeconfigSecretRef:
                name: {{ $secretName }}
                key: kubeconfig
              nodes:
                desired: {{ $desired }}
                running: {{ $running }}
                summary: "{{ $running }}/{{ $desired }}"
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
